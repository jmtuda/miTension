name: CI

on:
  push:
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mitension_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mitension_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: mitension_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_test_setup.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608310001_create_measurements.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/measurements_schema.test.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202608310002_add_measurement_ownership_rls.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/measurements_rls.test.sql

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  android-domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-33"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"
      - run: gradle :domain:test :app:testDebugUnitTest :app:assembleDebug
